[project]
name = "gd-rl-agent"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
gd-rl = "cli:app"

dependencies = [
    "torch>=2.3.0",
    "mss>=9.0.1",
    "pydirectinput>=1.0.4",
    "pywin32>=306",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]
